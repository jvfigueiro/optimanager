<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>OptiManager 3.0</title>

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Web App Manifest (PWA) -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Meta Tags PWA & Mobile -->
    <meta name="theme-color" content="#0B5694" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OptiManager" />
    <meta name="application-name" content="OptiManager" />
    <meta name="description" content="Sistema de gestão auto-hospedado de ordens de serviço, clientes e faturamento." />

    <!-- Immediate theme resolution script to prevent flash of unstyled theme -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('optimanager_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-[#0a0f1d] text-slate-800 dark:text-slate-100 font-sans antialiased min-h-screen selection:bg-sky-600 selection:text-white">
    <div id="app" class="min-h-screen flex flex-col"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
