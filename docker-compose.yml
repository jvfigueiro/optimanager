services:
  optimanager:
    build:
      context: .
      dockerfile: Dockerfile
    image: optimanager:3.0.0
    container_name: optimanager
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=8080
      - DB_PATH=/data/optimanager.db
      - TZ=America/Sao_Paulo
    volumes:
      - optimanager_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  optimanager_data:
    driver: local

